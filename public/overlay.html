<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBS X Son Dakika v4.1 Overlay</title><style>
:root{--line:#ffffff18;--text:#f7f9fc;--muted:#aeb6c4}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI Variable","Segoe UI",Arial,sans-serif}#stage{position:fixed;inset:0;display:flex;padding:44px;pointer-events:none}#stage.top-left{align-items:flex-start;justify-content:flex-start}#stage.top-center{align-items:flex-start;justify-content:center}#stage.top-right{align-items:flex-start;justify-content:flex-end}#stage.bottom-left{align-items:flex-end;justify-content:flex-start}#stage.bottom-center{align-items:flex-end;justify-content:center}#stage.bottom-right{align-items:flex-end;justify-content:flex-end}#card{width:min(980px,calc(100vw - 70px));opacity:0;transform:translateY(34px) scale(.985);filter:blur(6px);transition:all .38s cubic-bezier(.2,.9,.25,1.08)}#stage.show #card{opacity:1;transform:none;filter:none}#stage.media #card{width:min(1320px,calc(100vw - 70px))}.shell{background:linear-gradient(145deg,rgba(11,15,24,.98),rgba(20,25,35,.96));border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 28px 100px rgba(0,0,0,.55);backdrop-filter:blur(18px)}.topbar{height:50px;display:flex;align-items:center;gap:12px;padding:0 20px;color:white;background:linear-gradient(90deg,#233049,#1a1f29 70%)}.topbar.flash{background:linear-gradient(90deg,#f01438,#8c1026 65%,#23070d)}.topbar.media{background:linear-gradient(90deg,#28406f,#1d2636 65%,#0d1118)}.pulse{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.45s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #fff6}70%{box-shadow:0 0 0 10px #fff0}100%{box-shadow:0 0 0 0 #fff0}}.label{font-size:14px;font-weight:900;letter-spacing:.16em}.sub{margin-left:auto;font-size:11px;letter-spacing:.08em;font-weight:800;opacity:.85}.main{display:grid;grid-template-columns:1fr;gap:18px;padding:22px 24px 18px 26px}#stage.media.side .main{grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);align-items:start}#stage.media.below .main{grid-template-columns:1fr}.author{display:grid;grid-template-columns:56px 1fr;gap:14px}.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#222836;border:1px solid #ffffff1d}.fallback{display:grid;place-items:center;font-weight:900;color:white;font-size:20px}.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.name{font-size:18px;font-weight:900;color:var(--text)}.handle,.time,.group{font-size:13px;color:var(--muted)}.group{padding:4px 8px;border-radius:999px;background:#ffffff0c;border:1px solid #ffffff12}.text{margin-top:8px;color:var(--text);font-size:30px;line-height:1.22;font-weight:730;letter-spacing:-.02em;white-space:pre-wrap;overflow-wrap:anywhere}.text.medium{font-size:25px}.text.long{font-size:22px;line-height:1.28}.mediaBox{display:none;position:relative;min-height:280px;background:#090c12;border:1px solid #ffffff12;border-radius:18px;overflow:hidden}#stage.media .mediaBox{display:block}.mediaGrid{display:grid;width:100%;height:100%;gap:3px;background:#090c12}.mediaGrid.count1{grid-template-columns:1fr}.mediaGrid.count2{grid-template-columns:1fr 1fr}.mediaGrid.count3,.mediaGrid.count4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.mediaGrid.count3>*:first-child{grid-row:1/3}.mediaGrid img,.mediaGrid video{width:100%;height:100%;min-height:280px;max-height:440px;object-fit:cover;background:#080b11}.videoTag{position:absolute;right:12px;bottom:12px;padding:8px 10px;border-radius:999px;background:#0009;color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;display:none}.footer{display:flex;align-items:center;gap:8px;padding:0 24px 16px 96px;color:#8f97a5;font-size:12px;font-weight:800}.live{color:#ff5871}.pin{display:none;margin-left:auto;color:#ff9faf}#stage.pinned .pin{display:inline}.progress{height:4px;background:#ffffff0b}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#ff2447,#ff7f95);transform-origin:left}#stage.show:not(.pinned) .progress>i{animation:drain var(--duration,25s) linear forwards}@keyframes drain{to{transform:scaleX(0)}}#stage.pinned .progress>i{transform:scaleX(1)}</style></head><body><div id="stage" class="bottom-left side"><div id="card"><div class="shell"><div id="topbar" class="topbar"><span class="pulse"></span><span id="toplabel" class="label">GÜNCEL HABER</span><span id="topsub" class="sub">X CANLI AKIŞ</span></div><div class="main"><div class="copy"><div class="author"><div id="avatarWrap" class="avatar fallback">X</div><div><div class="meta"><span id="name" class="name"></span><span id="handle" class="handle"></span><span id="time" class="time"></span><span id="group" class="group"></span></div><div id="text" class="text"></div></div></div></div><div id="mediaBox" class="mediaBox"><div id="mediaGrid" class="mediaGrid"></div><div id="videoTag" class="videoTag">VIDEO</div></div></div><div class="footer"><span class="live">● CANLI</span><span id="footerText">Seçili paylaşım yayında</span><span class="pin">SABİTLENDİ</span></div><div class="progress"><i id="progress"></i></div></div></div></div><script>(()=>{const stage=document.getElementById("stage"),topbar=document.getElementById("topbar"),toplabel=document.getElementById("toplabel"),topsub=document.getElementById("topsub"),avatarWrap=document.getElementById("avatarWrap"),nameEl=document.getElementById("name"),handleEl=document.getElementById("handle"),timeEl=document.getElementById("time"),groupEl=document.getElementById("group"),textEl=document.getElementById("text"),mediaGrid=document.getElementById("mediaGrid"),videoTag=document.getElementById("videoTag"),footerText=document.getElementById("footerText");let ws,retry,lastId=null;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const initials=s=>(s||"X").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"X";function rel(iso){const d=new Date(iso||Date.now()),sec=Math.max(0,Math.floor((Date.now()-d)/1000));if(sec<60)return`${sec||1} sn`;if(sec<3600)return`${Math.floor(sec/60)} dk`;return`${Math.floor(sec/3600)} sa`}function resetClass(st,c){stage.className=`${st.position||"bottom-left"} ${st.mediaLayout||"side"}`;if(st.visible&&c)stage.classList.add("show");if(st.pinned)stage.classList.add("pinned");if(c?.displayMode!=="text"&&c?.mediaLoaded&&c?.media?.length)stage.classList.add("media");stage.style.setProperty("--duration",`${Math.max(5,(st.durationMs||25000)/1000)}s`)}function setupTemplate(c){const tpl=c.template||"news";topbar.className=`topbar ${tpl==="flash"?"flash":tpl==="media"?"media":""}`;if(tpl==="flash"){toplabel.textContent="SON DAKİKA";footerText.textContent="Kritik gelişme canlı yayında"}else if(tpl==="media"){toplabel.textContent="MEDYA GÜNDEMİ";footerText.textContent="Görsel veya videolu paylaşım"}else{toplabel.textContent="GÜNCEL HABER";footerText.textContent="Seçili paylaşım yayında"}topsub.textContent=c.level==="critical"?"YÜKSEK ÖNCELİK":c.level==="important"?"ÖNEMLİ":"RUTİN AKIŞ"}function renderMedia(c,st){mediaGrid.innerHTML="";videoTag.style.display="none";if(c.displayMode==="text"||!c.mediaLoaded||!c.media?.length)return;const list=c.media.slice(0,4);mediaGrid.className=`mediaGrid count${list.length}`;let hasVideo=false;list.forEach(m=>{if((m.type==="video"||m.type==="animated_gif")&&m.videoUrl){hasVideo=true;const v=document.createElement("video");v.src=m.videoUrl;v.autoplay=true;v.playsInline=true;v.preload="auto";v.loop=m.type==="animated_gif";v.muted=m.type==="animated_gif"?true:!!st.videoMuted;v.volume=Math.max(0,Math.min(1,Number(st.videoVolume??0.8)));mediaGrid.appendChild(v)}else{const img=document.createElement("img");img.src=m.url||m.preview;img.alt="";mediaGrid.appendChild(img)}});if(hasVideo)videoTag.style.display="block"}function render(st){const c=st.current;resetClass(st,c);if(!c)return;setupTemplate(c);nameEl.textContent=c.name||"X";handleEl.textContent=`@${c.username||"x"}`;timeEl.textContent=rel(c.createdAt);groupEl.textContent=c.group||"Genel";textEl.textContent=c.text||"";textEl.className="text";const len=(c.text||"").length;if(len>240)textEl.classList.add("long");else if(len>150)textEl.classList.add("medium");document.getElementById("avatarWrap").outerHTML=c.avatar?`<img id="avatarWrap" class="avatar" src="${esc(c.avatar)}" alt="">`:`<div id="avatarWrap" class="avatar fallback">${esc(initials(c.name))}</div>`;renderMedia(c,st);if(lastId!==c.id){lastId=c.id;const bar=document.getElementById("progress");bar.style.animation="none";void bar.offsetWidth;bar.style.animation=""}}function videoCommand(command){document.querySelectorAll("video").forEach(v=>{if(command==="play")v.play().catch(()=>{});if(command==="pause")v.pause();if(command==="restart"){v.currentTime=0;v.play().catch(()=>{})}})}function connect(){clearTimeout(retry);const proto=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(`${proto}://${location.host}`);ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==="state")render(m.state);if(m.type==="video-command")videoCommand(m.command)}catch{}};ws.onclose=()=>retry=setTimeout(connect,1200);ws.onerror=()=>{try{ws.close()}catch{}}}connect()})();</script></body></html>
